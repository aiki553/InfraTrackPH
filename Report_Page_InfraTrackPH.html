<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report | Infratrack PH</title>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(to right, #87CEFA, #FFDAB9);
            color: #333;
            margin: 0;
        }
        
        header {
            background-color: #ffb347;
            padding: 20px;
            font-size: 28px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px #d67f00;
            text-align: center;
        }
        
        nav {
            background-color: #ffeaa7;
            padding: 10px;
            text-align: center;
        }
        
        nav a {
            color: #333;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }
        
        nav a:hover {
            color: #ff6600;
        }
        
        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .report-box {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .report-box h2 {
            color: #ff8c42;
            margin-bottom: 10px;
            font-size: 26px;
        }
        
        .report-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
            font-size: 15px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffeaa7;
            border-radius: 8px;
            font-size: 15px;
            font-family: sans-serif;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ffb347;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #ffb347 0%, #ff8c42 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 140, 66, 0.4);
        }
        
        .info-icon {
            color: #ff8c42;
            font-size: 18px;
            margin-right: 5px;
        }
        
        footer {
            background-color: #ffb347;
            padding: 15px;
            color: white;
            text-align: center;
            margin-top: 40px;
        }
        
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 10px;
            }
            
            .report-box {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <header>📝 Report | Infratrack PH</header>
    
    <nav>
        <a href="Home_Page_InfratrackPH.html">🏠 Home</a>
        <a href="Check_Page_InfratrackPH.html">🔍 Check</a>
        <a href="Report_Page_InfratrackPH.html">📝 Report</a>
    </nav>
    
    <div class="container">
        <div class="report-box">
            <h2>Report an Infrastructure Issue</h2>
            <p>Help us keep our community safe! Your reports make a difference in maintaining quality infrastructure.</p>
            
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label><span class="info-icon">👤</span>Full Name</label>
                        <input type="text" placeholder="Juan Dela Cruz" required>
                    </div>
                    
                    <div class="form-group">
                        <label><span class="info-icon">📧</span>Email Address</label>
                        <input type="email" placeholder="your.email@example.com" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label><span class="info-icon">📱</span>Contact Number</label>
                        <input type="tel" placeholder="09XX-XXX-XXXX" required>
                    </div>
                    
                    <div class="form-group">
                        <label><span class="info-icon">🏗️</span>Issue Type</label>
                        <select required>
                            <option value="">Select issue type</option>
                            <option value="road">Road Damage</option>
                            <option value="bridge">Bridge Defect</option>
                            <option value="building">Building Issue</option>
                            <option value="drainage">Drainage/Flood Control</option>
                            <option value="electrical">Electrical Infrastructure</option>
                            <option value="water">Water System</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><span class="info-icon">📍</span>Location/Address</label>
                    <input type="text" placeholder="Street, Barangay, City/Municipality" required>
                </div>
                
                <div class="form-group">
                    <label><span class="info-icon">⚠️</span>Severity Level</label>
                    <select required>
                        <option value="">Select severity</option>
                        <option value="critical">Critical - Immediate danger to public safety</option>
                        <option value="high">High - Significant risk, needs urgent attention</option>
                        <option value="medium">Medium - Moderate issue, should be addressed soon</option>
                        <option value="low">Low - Minor issue, no immediate danger</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label><span class="info-icon">📝</span>Describe the Issue</label>
                    <textarea placeholder="Please provide detailed information about the infrastructure issue you observed, including when you noticed it and any potential hazards..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label><span class="info-icon">📸</span>Upload Photo (Optional)</label>
                    <input type="file" accept="image/*" style="padding: 8px;">
                </div>
                
                <button type="submit" class="submit-btn">Submit Report</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2025 Infrastructure Watch | Group 2 - IT-1115
    </footer>
</body>
</html>
